const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function demoCommit(action,payload){const existing=demoStore.transactions.find(t=>t.requestId===payload.requestId)||demoStore.projects.find(p=>p._requestId===payload.requestId);if(existing){if(existing._payload&&existing._payload!==JSON.stringify(payload)){const e=new Error('คำขอเดิมมีข้อมูลต่างจากครั้งก่อน');e.definite=true;throw e;}return {record:structuredClone(existing),bootstrap:demoBootstrap()};}if(demoConfig.role==='viewer'){const e=new Error('บัญชีครูมีสิทธิ์ดูข้อมูลเท่านั้น');e.definite=true;throw e;}let record;if(action==='CREATE_PROJECT'){if(demoStore.projects.some(p=>p.code.toLowerCase()===payload.code.toLowerCase()&&p.fiscalYear===payload.fiscalYear&&p.fundId===payload.fundId)){const e=new Error('รหัสโครงการนี้มีอยู่แล้วในปีงบประมาณที่เลือก');e.definite=true;throw e;}record={...payload,id:uuid(),_requestId:payload.requestId,_createdBy:demoUser().email,_payload:JSON.stringify(payload)};delete record.requestId;demoStore.projects.push(record);if(!demoStore.fiscalYears.includes(record.fiscalYear))demoStore.fiscalYears.push(record.fiscalYear);}else{const p=demoStore.projects.find(p=>p.id===payload.projectId);if(!p){const e=new Error('ไม่พบโครงการที่เลือก');e.definite=true;throw e;}const s=projectTotals(p,demoStore);if(payload.type==='expense'&&(payload.amountSatang>s.budgetRemaining||payload.amountSatang>s.cashBalance)){const e=new Error(payload.amountSatang>s.budgetRemaining?'ยอดจ่ายเกินวงเงินงบประมาณที่เหลือ กรุณาตรวจสอบจำนวนเงิน':'ยอดจ่ายเกินเงินจริงที่มีในโครงการ กรุณาตรวจสอบเงินรับและยอดยกมา');e.definite=true;throw e;}record={...payload,id:uuid(),fundId:p.fundId,fiscalYear:p.fiscalYear,createdAt:new Date().toISOString(),createdBy:demoUser().email,_payload:JSON.stringify(payload)};demoStore.transactions.push(record);}demoStore.revision=String(Number(demoStore.revision||0)+1);persistDemo();return {record:structuredClone(record),bootstrap:demoBootstrap()};}
async function demoAPI(action,payload){if(!demoStore)loadDemoStore();if(action==='GET_BOOTSTRAP'){await sleep(400);return demoBootstrap();}if(action==='CHECK_OPERATION'){await sleep(500);const record=demoStore.transactions.find(t=>t.requestId===payload.requestId&&t.createdBy===demoUser().email)||demoStore.projects.find(p=>p._requestId===payload.requestId&&p._createdBy===demoUser().email);return record?{found:true,record:structuredClone(record),bootstrap:demoBootstrap()}:{found:false};}if(action==='REPAIR_SCHEMA'){await sleep(600);return {message:'ตรวจโครงสร้างตัวอย่างเรียบร้อย ไม่มีการเชื่อมต่อชีทจริง'};}const already=demoStore.transactions.find(t=>t.requestId===payload.requestId)||demoStore.projects.find(p=>p._requestId===payload.requestId);if(already){await sleep(350);return demoCommit(action,payload);}const outcome=demoConfig.next;demoConfig.next='success';saveDemoConfig();if(outcome==='timeout'){setTimeout(()=>{try{demoCommit(action,payload);}catch(e){/* The unresolved operation is retried against the same ID. */}},Math.max(2500,demoConfig.delay+1200));await sleep(700);const e=new Error('ยังยืนยันผลจากเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบรายการล่าสุด');e.ambiguous=true;throw e;}await sleep(Math.max(250,Number(demoConfig.delay)||1400));if(outcome==='reject'){const e=new Error('ตัวอย่างการปฏิเสธ: ไม่สามารถบันทึกรายการนี้ได้ ข้อมูลเดิมยังคงอยู่');e.definite=true;throw e;}return demoCommit(action,payload);}
function saveDemoConfig(){try{localStorage.setItem('sb-demo-config-v1',JSON.stringify(demoConfig));}catch(e){}}
function api(action,payload={}){if(!IS_GAS)return demoAPI(action,payload);return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(settled)return;settled=true;const e=new Error('ยังยืนยันผลจากเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบรายการล่าสุดก่อนส่งซ้ำ');e.ambiguous=true;reject(e);},60000);google.script.run.withSuccessHandler(res=>{if(settled){if(action.startsWith('CREATE_'))refresh(false);return;}settled=true;clearTimeout(timer);if(res?.status==='success')resolve(res.data);else{const e=new Error(res?.message||'ระบบไม่สามารถดำเนินการได้');e.code=res?.code;e.definite=!!res?.code&&!['SERVER_ERROR','SERVER_BUSY'].includes(res.code);e.ambiguous=!e.definite;reject(e);}}).withFailureHandler(err=>{if(settled)return;settled=true;clearTimeout(timer);const e=new Error(err?.message||'การเชื่อมต่อขัดข้อง ยังยืนยันผลไม่ได้');e.ambiguous=true;reject(e);}).apiGateway(action,payload);});}
function canWrite(){return ['admin','writer'].includes(State.data?.user?.role);}function fundName(id){return State.data?.funds.find(f=>f.id===id)?.name||id;}function projectName(id){return State.data?.projects.find(p=>p.id===id)?.name||'โครงการใหม่';}function pendingKey(){return 'sb-'+(IS_GAS?'live':'demo')+'-pending-v1:'+State.data.user.email;}function persistPending(){if(!State.data)return;try{sessionStorage.setItem(pendingKey(),JSON.stringify(State.pending));}catch(e){toast('เบราว์เซอร์ไม่อนุญาตให้เก็บสถานะคำขอ กรุณาตรวจสอบรายการก่อนปิดหน้านี้','warning');}}
function restorePending(){try{State.pending=JSON.parse(sessionStorage.getItem(pendingKey())||'[]').filter(p=>['CREATE_TRANSACTION','CREATE_PROJECT'].includes(p.action)&&p.payload?.requestId).map(p=>({...p,state:'uncertain'}));}catch(e){State.pending=[];}persistPending();}
function applyBootstrap(data){if(!data||data.schemaVersion!==1||!data.user?.email||!Array.isArray(data.projects)||!Array.isArray(data.transactions)||!Array.isArray(data.funds))throw new Error('รูปแบบข้อมูลจากเซิร์ฟเวอร์ไม่ตรงกับระบบ');const sameActor=State.data?.user?.email===data.user.email;const older=sameActor&&Number.isFinite(Number(data.revision))&&Number.isFinite(Number(State.data.revision))&&Number(data.revision)<Number(State.data.revision);if(older)return;State.data=data;const ids=new Set(data.transactions.map(t=>t.requestId));State.pending=State.pending.filter(p=>p.action!=='CREATE_TRANSACTION'||!ids.has(p.payload.requestId));if(!data.fiscalYears.includes(Number(State.year)))State.year=data.fiscalYears.slice().sort((a,b)=>b-a)[0]||2570;if(!data.funds.some(f=>f.id===State.fund))State.fund='all';persistPending();renderChrome();}
function persistFilters(){try{localStorage.setItem((IS_GAS?'sb-live-filters':'sb-demo-filters')+'-v1',JSON.stringify({year:State.year,fund:State.fund}));}catch(e){}}
function projectTotals(p,data=State.data){const ts=data.transactions.filter(t=>t.projectId===p.id);let receipts=0,expenses=0;ts.forEach(t=>{if(t.type==='income')receipts+=t.amountSatang;else expenses+=t.amountSatang;});return {allocated:p.allocatedSatang,opening:p.openingSatang,receipts,expenses,budgetRemaining:p.allocatedSatang-expenses,cashBalance:p.openingSatang+receipts-expenses};}
function totals(projects){return projects.reduce((s,p)=>{const t=projectTotals(p);Object.keys(s).forEach(k=>s[k]+=t[k]);return s;},{allocated:0,opening:0,receipts:0,expenses:0,budgetRemaining:0,cashBalance:0});}
function scopedProjects(){return State.data.projects.filter(p=>p.fiscalYear===Number(State.year)&&(State.fund==='all'||p.fundId===State.fund));}
function filteredProjects(){const q=State.query.trim().toLowerCase();return scopedProjects().filter(p=>!q||[p.name,p.code,p.owner,p.category].join(' ').toLowerCase().includes(q));}
function relevantPending(projects){const ids=new Set(projects.map(p=>p.id));return State.pending.filter(o=>o.action==='CREATE_TRANSACTION'?ids.has(o.payload.projectId):(o.payload.fiscalYear===Number(State.year)&&(State.fund==='all'||o.payload.fundId===State.fund)));}
function provisional(projects,fundId=null){const ids=new Set(projects.map(p=>p.id));const fundIds=new Set(fundId?[fundId]:projects.map(p=>p.fundId));let allocation=0,opening=0,receipts=0,expenses=0,count=0;State.pending.forEach(o=>{const p=o.payload;if(o.action==='CREATE_TRANSACTION'&&ids.has(p.projectId)){count++;if(p.type==='income')receipts+=p.amountSatang;else expenses+=p.amountSatang;}if(State.view!=='detail'&&o.action==='CREATE_PROJECT'&&p.fiscalYear===Number(State.year)&&fundIds.has(p.fundId)){count++;allocation+=p.allocatedSatang;opening+=p.openingSatang;}});return {count,allocation,opening,receipts,expenses};}
function projectPending(p){return State.pending.filter(o=>o.action==='CREATE_TRANSACTION'&&o.payload.projectId===p.id);}
function activeFunds(){return State.data.funds.filter(f=>State.fund==='all'||State.fund===f.id);}
function toast(message,type='success'){const el=document.createElement('div');el.className='toast '+(type==='success'?'':type);el.innerHTML=icon(type==='success'?'check':type==='warning'?'clock':'alert')+'<span>'+esc(message)+'</span>';$('#toast-region').append(el);setTimeout(()=>el.remove(),type==='success'?4500:7000);}
function renderChrome(){const nav=()=>NAV.map(([id,ic,label])=>`<button type="button" class="nav-btn ${State.view===id||(State.view==='detail'&&id==='projects')?'active':''}" data-route="${id}" ${State.view===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('');$('.main-nav').innerHTML=nav();$('.nav-bottom').innerHTML=nav();$$('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));if(!State.data)return;const u=State.data.user;$('#profile').innerHTML=`<div class="avatar">${esc((u.name||u.email).slice(0,1))}</div><div><div class="profile-name">${esc(u.name||u.email)}</div><div class="profile-role">${u.role==='admin'?'ผู้ดูแลระบบ':u.role==='writer'?'ผู้บันทึกข้อมูล':'ครู · ดูข้อมูล'}</div></div>`;$('#mode-pill').className='pill '+(IS_GAS?'ok':'sample');$('#mode-pill').innerHTML=IS_GAS?icon('shield')+'เชื่อมต่อชีทจริง':'ข้อมูลตัวอย่าง';$('#sync-time').innerHTML='<span class="status-dot"></span>อัปเดต '+new Intl.DateTimeFormat('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}).format(new Date(State.data.serverTime));}
function header(title,subtitle,actions='',eyebrow='SCHOOL BUDGET'){return `<div class="page-head"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p class="page-sub">${subtitle}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`;}
function filters(search=true){return `<div class="filters"><div class="filter-field"><label for="filter-year">ปีงบประมาณ</label><select id="filter-year">${State.data.fiscalYears.slice().sort((a,b)=>b-a).map(y=>`<option value="${y}" ${Number(State.year)===y?'selected':''}>พ.ศ. ${y}</option>`).join('')}</select></div><div class="filter-field"><label for="filter-fund">กองเงิน</label><select id="filter-fund"><option value="all" ${State.fund==='all'?'selected':''}>แสดงทั้งสองกอง</option>${State.data.funds.map(f=>`<option value="${esc(f.id)}" ${State.fund===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div>${search?`<div class="filter-search">${icon('search')}<label class="sr-only" for="global-search">ค้นหาโครงการหรือรายการ</label><input id="global-search" type="search" value="${esc(State.query)}" placeholder="ค้นหาชื่อโครงการ รหัส หรือรายการ…" autocomplete="off"></div>`:`<div style="margin-left:auto" class="filter-caption">แสดงยอดยืนยันแล้ว · หน่วย: บาท</div>`}</div>`;}
function metric(label,value,cl=''){return `<div class="metric-block"><label>${label}</label><strong class="num ${cl}">${money(value)}</strong></div>`;}
function provisionalHTML(projects,base,fundId=null){const p=provisional(projects,fundId);if(!p.count)return '';return `<div class="provisional">${icon('clock')} <strong>${p.count} รายการรอยืนยัน · ยอดคาดการณ์แยกจากยอดจริง</strong><div class="provisional-grid"><span>หากสำเร็จ: งบเหลือ <b class="num">${money(base.budgetRemaining+p.allocation-p.expenses)}</b></span><span>เงินจริงเหลือ <b class="num">${money(base.cashBalance+p.opening+p.receipts-p.expenses)}</b></span></div></div>`;}
function fundCard(f){const ps=scopedProjects().filter(p=>p.fundId===f.id),s=totals(ps),percentValue=pct(s.expenses,s.allocated);return `<section class="panel"><div class="fund-head"><div class="fund-icon ${f.id==='student'?'student':''}">${icon(f.id==='student'?'students':'book')}</div><div><div class="fund-name">${esc(f.name)}</div><div class="small muted" style="font-size:11px">${ps.length} โครงการ · ปีงบประมาณ ${State.year}</div></div><span class="pill readonly">แยกกองเงิน</span></div><div class="row-heading">${icon('folder')} วงเงินงบประมาณ</div><div class="metric-row">${metric('งบจัดสรร',s.allocated)}${metric('ใช้จ่ายแล้ว',s.expenses)}${metric('งบคงเหลือ',s.budgetRemaining,s.budgetRemaining<0?'negative':'')}</div><div class="row-heading cash-label">${icon('wallet')} เงินจริง · รวมเงินยกมา ${money(s.opening)}</div><div class="metric-row cash">${metric('รับเงินจริง',s.receipts)}${metric('จ่ายเงินจริง',s.expenses)}${metric('เงินจริงคงเหลือ',s.cashBalance,s.cashBalance<0?'negative':'')}</div><div class="fund-foot"><div class="progress-head"><span>การใช้งบประมาณ</span><strong>${percent(percentValue)} ของวงเงินจัดสรร</strong></div><div class="track"><div class="fill ${f.id==='student'?'student':''} ${percentValue>100?'danger':''}" style="width:${Math.min(100,Math.max(0,percentValue))}%"></div></div></div>${provisionalHTML(ps,s,f.id)}</section>`;}
function empty(title='ยังไม่มีข้อมูล',text='รายการจะแสดงที่นี่เมื่อมีการบันทึก'){return `<div class="empty">${icon('folder')}<strong>${title}</strong><p>${text}</p></div>`;}
function pendingPanel(projects=null){const ops=(projects?relevantPending(projects):State.pending).filter(o=>State.view!=='detail'||o.action==='CREATE_TRANSACTION');if(!ops.length)return '';return `<section class="panel pending-panel"><div class="panel-title"><h2>${icon('clock')} รายการรอยืนยัน</h2><span class="pill pending">${ops.length} รายการ</span></div>${ops.map(o=>{const p=o.payload,sending=o.state==='sending';return `<div class="pending-row"><span class="pill pending">${sending?'กำลังบันทึก':'รอยืนยัน'}</span><div class="pending-detail"><b>${esc(o.action==='CREATE_PROJECT'?p.name:p.title)}</b><p>${esc(o.action==='CREATE_PROJECT'?'โครงการใหม่ · '+fundName(p.fundId):projectName(p.projectId))}${o.error?' · '+esc(o.error):''}</p></div><span class="num">${o.action==='CREATE_PROJECT'?'งบ '+money(p.allocatedSatang):(p.type==='income'?'+':'−')+money(p.amountSatang)}</span>${!sending?`<div class="pending-actions"><button class="btn small" data-check="${esc(p.requestId)}" ${State.busyChecks.has(p.requestId)?'disabled':''}>${icon('refresh')}ตรวจสอบ</button>${canWrite()?`<button class="btn small soft" data-retry="${esc(p.requestId)}">ส่งคำขอเดิมซ้ำ</button>`:''}</div>`:`<span class="spinner" aria-label="กำลังบันทึก"></span>`}</div>`;}).join('')}</section>`;}
function failuresHTML(){return State.failures.map((o,i)=>`<div class="draft-error"><div><strong>บันทึกไม่สำเร็จ · เก็บฉบับร่างไว้แล้ว</strong><p>${esc(o.error)}</p></div><button class="btn small" data-draft="${i}">เปิดฉบับร่าง</button></div>`).join('');}
function miniProject(p){const s=projectTotals(p),pc=pct(s.expenses,s.allocated);return `<div class="project-mini" data-project="${esc(p.id)}" role="button" tabindex="0" aria-label="เปิดโครงการ ${esc(p.name)}"><div><div class="project-mini-name">${esc(p.name)}</div><div class="project-mini-code">${esc(p.code)} · ${esc(fundName(p.fundId))}</div></div><div class="project-mini-money num"><small>งบคงเหลือ</small>${money(s.budgetRemaining)}</div><div class="track"><div class="fill ${p.fundId==='student'?'student':''}" style="width:${Math.min(100,Math.max(0,pc))}%"></div></div></div>`;}
function recentRow(t,pending=false){const p=State.data.projects.find(p=>p.id===t.projectId);return `<div class="recent-tx"><div class="tx-icon ${t.type==='expense'?'expense':''}">${icon(t.type==='income'?'down':'up')}</div><div style="min-width:0"><div class="recent-tx-title">${esc(t.title)}</div><div class="recent-tx-meta">${dateText(t.date)} · ${esc(p?.code||'')}</div></div><div class="recent-tx-amount ${t.type}"><div class="num">${t.type==='income'?'+':'−'}${money(t.amountSatang)}</div>${pending?'<span class="pill pending">รอยืนยัน</span>':''}</div></div>`;}
function overview(){const ps=scopedProjects();const ids=new Set(ps.map(p=>p.id));const ts=State.data.transactions.filter(t=>ids.has(t.projectId)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4);return header('ภาพรวมงบประมาณ','ติดตามวงเงินและเงินจริงของแต่ละกองในหน้าเดียว',canWrite()?`<button class="btn primary" data-action="new-transaction">${icon('plus')}<span>บันทึกรายการ</span></button>`:'<span class="pill readonly">'+icon('shield')+'สิทธิ์ดูข้อมูล</span>')+filters(false)+failuresHTML()+pendingPanel(ps)+`<div class="fund-grid ${activeFunds().length===1?'single':''}">${activeFunds().map(fundCard).join('')}</div><div class="section-head"><h2>ติดตามโครงการและรายการล่าสุด</h2><small>ยอดที่ยืนยันแล้ว</small></div><div class="overview-bottom"><section class="panel"><div class="panel-title"><h2>โครงการในปีงบประมาณ</h2><button class="btn text" data-route="projects">ดูทั้งหมด ${icon('arrow')}</button></div>${ps.length?ps.slice(0,4).map(miniProject).join(''):empty('ยังไม่มีโครงการ','เพิ่มโครงการเพื่อเริ่มติดตามงบประมาณ')}</section><section class="panel"><div class="panel-title"><h2>รายการเงินจริงล่าสุด</h2><button class="btn text" data-route="transactions">ดูทั้งหมด ${icon('arrow')}</button></div>${ts.length?ts.map(t=>recentRow(t)).join(''):empty('ยังไม่มีรายการเงินจริง','ยอดรับและจ่ายจริงจะแสดงเมื่อบันทึก')}</section></div><p class="small muted" style="font-size:11px;margin-top:18px">${IS_GAS?'ยอดหลักเป็นข้อมูลที่เซิร์ฟเวอร์ยืนยันแล้ว':'ข้อมูลทั้งหมดเป็นตัวอย่างสำหรับทดลอง ไม่ใช่งบประมาณจริงของโรงเรียน'} · งบคงเหลือ = จัดสรร − จ่าย · เงินจริงคงเหลือ = ยกมา + รับ − จ่าย</p>`;}
function projectRow(p){const s=projectTotals(p),pc=pct(s.expenses,s.allocated),n=projectPending(p).length;return `<tr><td class="project-cell"><button class="btn text" style="display:block;text-align:left;padding:0;white-space:normal;min-height:44px" data-project="${esc(p.id)}"><b>${esc(p.name)}</b><small>${esc(p.code)} · ${esc(p.owner)}</small></button><span class="pill fund" style="font-size:10px;margin-top:6px">${esc(fundName(p.fundId))}</span>${n?` <span class="pill pending" style="font-size:10px">${n} รอยืนยัน</span>`:''}</td><td class="right num">${money(s.allocated)}</td><td class="right num">${money(s.expenses)}</td><td class="right num"><b>${money(s.budgetRemaining)}</b></td><td class="right num positive">${money(s.cashBalance)}</td><td><div class="table-progress">${percent(pc)}<div class="track"><div class="fill ${p.fundId==='student'?'student':''}" style="width:${Math.min(100,Math.max(0,pc))}%"></div></div></div></td><td><button class="btn icon small" data-project="${esc(p.id)}" aria-label="ดูโครงการ ${esc(p.name)}">${icon('arrow')}</button></td></tr>`;}
function mobileProject(p){const s=projectTotals(p),pc=pct(s.expenses,s.allocated),n=projectPending(p).length;return `<article class="panel project-mobile" data-project="${esc(p.id)}" tabindex="0" role="button" aria-label="เปิดโครงการ ${esc(p.name)}"><div class="project-mobile-head"><span>${esc(p.code)}</span><span class="pill fund" style="font-size:10px">${esc(fundName(p.fundId))}</span></div><div class="project-mobile-name">${esc(p.name)}</div><div class="project-mobile-owner">${esc(p.owner)} ${n?`· ${n} รายการรอยืนยัน`:''}</div><div class="project-mobile-metrics"><div>งบคงเหลือ<strong class="num">${money(s.budgetRemaining)}</strong></div><div>เงินจริงคงเหลือ<strong class="num positive">${money(s.cashBalance)}</strong></div></div><div class="project-mobile-progress"><div class="progress-head"><span>งบจัดสรร ${money(s.allocated)}</span><span>ใช้ไป ${percent(pc)}</span></div><div class="track"><div class="fill ${p.fundId==='student'?'student':''}" style="width:${Math.min(100,Math.max(0,pc))}%"></div></div></div></article>`;}
function projects(){const ps=filteredProjects();const pendingProjects=State.pending.filter(o=>o.action==='CREATE_PROJECT'&&o.payload.fiscalYear===Number(State.year)&&(State.fund==='all'||o.payload.fundId===State.fund));return header('โครงการทั้งหมด','ดูวงเงินที่ได้รับจัดสรร การใช้จ่าย และเงินจริงรายโครงการ',canWrite()?`<button class="btn primary" data-action="new-project">${icon('plus')}<span>เพิ่มโครงการ</span></button>`:'')+filters()+failuresHTML()+pendingPanel(scopedProjects())+`<section class="panel desktop-projects"><div class="table-caption"><strong>รายการโครงการ <span style="margin-left:5px">${ps.length} โครงการ</span></strong><span>ยอดยืนยันแล้ว · บาท</span></div>${ps.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>โครงการ / ผู้รับผิดชอบ</th><th class="right">งบจัดสรร</th><th class="right">จ่ายแล้ว</th><th class="right">งบคงเหลือ</th><th class="right">เงินจริงคงเหลือ</th><th>ใช้ไป</th><th><span class="sr-only">เปิดโครงการ</span></th></tr></thead><tbody>${ps.map(projectRow).join('')}</tbody></table></div>`:empty('ไม่พบโครงการ','ลองเปลี่ยนคำค้น กองเงิน หรือปีงบประมาณ')}<div class="table-foot">งบคงเหลือและเงินจริงคงเหลือเป็นคนละยอด · เปิดโครงการเพื่อดูเงินยกมาและรายละเอียดรับ / จ่าย</div></section><div class="mobile-projects">${ps.length?ps.map(mobileProject).join(''):empty('ไม่พบโครงการ','ลองเปลี่ยนตัวกรองหรือคำค้น')}</div>${pendingProjects.length?`<div class="notice" style="margin-top:16px">${icon('clock')}<span>โครงการใหม่ ${pendingProjects.length} โครงการกำลังรอยืนยัน จะแสดงในตารางเมื่อบันทึกสำเร็จ</span></div>`:''}`;}
function txRows(projects){const ids=new Set(projects.map(p=>p.id)),q=State.query.trim().toLowerCase();return State.data.transactions.filter(t=>ids.has(t.projectId)&&(State.txType==='all'||t.type===State.txType)&&(!State.dateFrom||t.date>=State.dateFrom)&&(!State.dateTo||t.date<=State.dateTo)&&(!q||[t.title,t.documentNo,projectName(t.projectId),State.data.projects.find(p=>p.id===t.projectId)?.code].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));}
function txTable(projects){const ts=txRows(projects);return `<section class="panel"><div class="table-caption"><strong>รายการรับ / จ่าย <span>${ts.length} รายการ</span></strong><span>ยอดยืนยันแล้ว</span></div><div class="tx-filters"><label for="tx-type">ประเภท</label><select id="tx-type"><option value="all">รับและจ่าย</option><option value="income" ${State.txType==='income'?'selected':''}>รับเงินจริง</option><option value="expense" ${State.txType==='expense'?'selected':''}>จ่ายเงินจริง</option></select><label for="tx-from">ตั้งแต่</label><input type="date" id="tx-from" value="${esc(State.dateFrom)}" aria-label="วันที่เริ่มต้น"><label for="tx-to">ถึง</label><input type="date" id="tx-to" value="${esc(State.dateTo)}" aria-label="วันที่สิ้นสุด">${State.dateFrom||State.dateTo?'<button class="btn text small" data-action="clear-dates">ล้างวันที่</button>':''}</div>${ts.length?`<div class="table-wrap"><table class="data-table tx-table"><thead><tr><th>วันที่</th><th>รายการ / เอกสาร</th><th>โครงการ</th><th>ประเภท</th><th class="right">จำนวนเงิน (บาท)</th></tr></thead><tbody>${ts.map(t=>{const p=State.data.projects.find(p=>p.id===t.projectId);return `<tr><td class="tx-date">${dateText(t.date)}</td><td class="tx-name"><b>${esc(t.title)}</b><small>${esc(t.documentNo||'ไม่มีเลขที่เอกสาร')}${t.note?' · '+esc(t.note):''}</small></td><td><button class="btn text small" data-project="${esc(t.projectId)}">${esc(p?.code||'')} ${icon('arrow')}</button><div class="small muted" style="font-size:10px">${esc(fundName(t.fundId))}</div></td><td><span class="pill ${t.type==='income'?'ok':'readonly'}">${t.type==='income'?'รับเงินจริง':'จ่ายเงินจริง'}</span></td><td class="right num ${t.type}"><b>${t.type==='income'?'+':'−'}${money(t.amountSatang)}</b></td></tr>`;}).join('')}</tbody></table></div>`:empty('ไม่พบรายการ','ลองเปลี่ยนตัวกรอง หรือเริ่มบันทึกรายการเงินจริง')}<div class="table-foot">รายการรับเพิ่มเงินจริง โดยไม่เพิ่มวงเงินจัดสรร · เงินรับจริงเพิ่มยอดเงินจริงคงเหลือ โดยไม่เพิ่มวงเงินงบประมาณที่จัดสรร</div></section>`;}
function transactions(){return header('รายการเงินจริง','บันทึกและตรวจสอบการรับ–จ่ายเงินของแต่ละโครงการ',canWrite()?`<button class="btn primary" data-action="new-transaction">${icon('plus')}<span>บันทึกรายการ</span></button>`:'')+filters()+failuresHTML()+pendingPanel(scopedProjects())+txTable(scopedProjects());}
function detail(){const p=State.data.projects.find(p=>p.id===State.projectId);if(!p)return header('ไม่พบโครงการ','โครงการอาจยังอยู่ระหว่างบันทึก')+`<button class="btn" data-route="projects">กลับรายการโครงการ</button>`;const s=projectTotals(p);return `<button class="btn text back-button" data-route="projects">${icon('back')}กลับรายการโครงการ</button><div class="page-head detail-head"><div><span class="eyebrow">PROJECT DETAIL · ${esc(p.code)}</span><span class="pill fund">${esc(fundName(p.fundId))}</span><h1 class="detail-name">${esc(p.name)}</h1><div class="detail-meta"><span>ปีงบประมาณ ${p.fiscalYear}</span><span>${esc(p.category)}</span><span>ผู้รับผิดชอบ: ${esc(p.owner)}</span></div></div>${canWrite()?`<button class="btn primary" data-add-to="${esc(p.id)}">${icon('plus')}<span>บันทึกรายการ</span></button>`:'<span class="pill readonly">ดูข้อมูล</span>'}</div>${failuresHTML()}${pendingPanel([p])}<div class="detail-summary"><section class="panel"><div class="panel-title"><h2>${icon('folder')} วงเงินงบประมาณ</h2><span class="small muted">บาท</span></div><div class="metric-row">${metric('งบจัดสรร',s.allocated)}${metric('ใช้จ่ายแล้ว',s.expenses)}${metric('งบคงเหลือ',s.budgetRemaining)}</div></section><section class="panel"><div class="panel-title"><h2>${icon('wallet')} เงินจริง</h2><span class="small muted" style="font-size:11px">ยกมา ${money(s.opening)}</span></div><div class="metric-row">${metric('รับเงินจริง',s.receipts)}${metric('จ่ายเงินจริง',s.expenses)}${metric('เงินจริงคงเหลือ',s.cashBalance,'positive')}</div></section></div>${provisionalHTML([p],s)}${txTable([p])}`;}
function settings(){const u=State.data.user;return header('ตั้งค่าและสถานะระบบ','ข้อมูลบัญชี การเชื่อมต่อ และการดูแลโครงสร้างข้อมูล')+`<div class="settings-grid"><section class="panel"><div class="panel-title"><h2>${icon('shield')} บัญชีและสิทธิ์</h2></div><div class="settings-body"><div class="setting-row"><span>บัญชีผู้ใช้งาน</span><b>${esc(u.email)}</b></div><div class="setting-row"><span>สิทธิ์ใช้งาน</span><b>${u.role==='admin'?'ผู้ดูแลระบบ':u.role==='writer'?'ผู้บันทึกข้อมูล':'ครู · ดูข้อมูล'}</b></div><div class="setting-row"><span>การเชื่อมต่อ</span><b>${IS_GAS?'Google Apps Script':'โหมดข้อมูลตัวอย่าง'}</b></div><p>${canWrite()?'บัญชีนี้เพิ่มโครงการและบันทึกรายการเงินจริงได้':'บัญชีนี้เปิดดูยอด โครงการ และรายการเงินจริงได้'}</p></div></section><section class="panel"><div class="panel-title"><h2>${icon('ledger')} ฐานข้อมูลและการตรวจสอบ</h2></div><div class="settings-body"><div class="setting-row"><span>โครงสร้างข้อมูล</span><b>เวอร์ชัน ${State.data.schemaVersion}</b></div><div class="setting-row"><span>ข้อมูลล่าสุด</span><b>${dateText(State.data.serverTime)}</b></div><div class="setting-row"><span>คำขอรอยืนยันของบัญชีนี้</span><b>${State.pending.length} รายการ</b></div><p>ตรวจและเติมโครงสร้างตารางของระบบ โดยเก็บข้อมูลที่มีอยู่ไว้</p>${u.role==='admin'?'<button class="btn" data-action="repair-schema">'+icon('refresh')+'ตรวจ / ซ่อมโครงสร้างชีท</button>':'<span class="pill readonly">ดำเนินการโดยผู้ดูแลระบบ</span>'}</div></section>${!IS_GAS?`<section class="panel" style="grid-column:1/-1"><div class="panel-title"><h2>ทดลองพฤติกรรมการบันทึก</h2><span class="pill sample">ใช้เฉพาะข้อมูลตัวอย่าง</span></div><div class="settings-body"><p>ข้อมูลตัวอย่าง 6 โครงการสำหรับตรวจหน้าเว็บ การหน่วงเวลา และผลตอบกลับ ไม่มีการเขียนลง Google Sheets จริง</p><div class="form-grid"><div><label for="demo-role">บทบาทตัวอย่าง</label><select id="demo-role" ${State.pending.length?'disabled':''}><option value="admin" ${demoConfig.role==='admin'?'selected':''}>ฝ่ายแผนงาน / ผู้ดูแล</option><option value="viewer" ${demoConfig.role==='viewer'?'selected':''}>ครู · ดูข้อมูล</option></select></div><div><label for="demo-delay">เวลาบันทึกตัวอย่าง</label><select id="demo-delay"><option value="1400" ${Number(demoConfig.delay)===1400?'selected':''}>1.4 วินาที</option><option value="5000" ${Number(demoConfig.delay)===5000?'selected':''}>5 วินาที</option><option value="10000" ${Number(demoConfig.delay)===10000?'selected':''}>10 วินาที</option></select></div><div class="field full"><label for="demo-outcome">ผลคำขอถัดไป</label><select id="demo-outcome"><option value="success" ${demoConfig.next==='success'?'selected':''}>บันทึกสำเร็จ</option><option value="reject" ${demoConfig.next==='reject'?'selected':''}>ปฏิเสธรายการ · เก็บฉบับร่าง</option><option value="timeout" ${demoConfig.next==='timeout'?'selected':''}>ผลยังไม่แน่นอน · จำลองคำตอบขาดหาย</option></select><small>กรณีผลไม่แน่นอน ระบบตัวอย่างจะบันทึกภายหลัง ใช้ปุ่มตรวจสอบหรือส่งคำขอเดิมซ้ำได้</small></div></div><div style="margin-top:20px"><button class="btn" data-action="reset-demo">${icon('refresh')}คืนข้อมูลตัวอย่างเริ่มต้น</button></div></div></section>`:''}</div>`;}
function render(){renderChrome();const main=$('#main');if(State.loading){main.innerHTML=header('กำลังโหลดข้อมูล','ตรวจสอบบัญชีและข้อมูลล่าสุด')+'<div class="load-label"><span class="spinner"></span>กำลังเชื่อมต่อระบบ…</div><div class="fund-grid"><div class="skeleton"></div><div class="skeleton"></div></div><div class="skeleton small"></div>';return;}if(State.error||!State.data){main.innerHTML=`<div class="panel auth-error">${icon('alert')}<h2>ยังเปิดข้อมูลระบบไม่ได้</h2><p>${esc(State.error||'ไม่พบข้อมูล')}</p><p>${IS_GAS?'ตรวจสอบบัญชี Google และสิทธิ์ในตารางผู้ใช้งานของระบบ':'ลองโหลดหน้าใหม่เพื่อเปิดข้อมูลตัวอย่าง'}</p><button class="btn primary" data-action="refresh">${icon('refresh')}ลองเชื่อมต่ออีกครั้ง</button></div>`;return;}main.innerHTML=({overview,projects,transactions,settings,detail}[State.view]||overview)();}
function route(view,projectId=null){State.view=view;State.projectId=projectId;State.query='';State.txType='all';State.dateFrom='';State.dateTo='';location.hash=view==='detail'?'project/'+encodeURIComponent(projectId):view;render();window.scrollTo({top:0,behavior:'instant'});}
async function refresh(showToast=true){if(!State.data){State.loading=true;State.error=null;render();}try{const oldEmail=State.data?.user?.email;const data=await api('GET_BOOTSTRAP');applyBootstrap(data);if(!oldEmail||oldEmail!==data.user.email){restorePending();State.failures=[];}State.loading=false;State.error=null;render();if(showToast)toast('โหลดข้อมูลล่าสุดแล้ว');State.pending.filter(o=>o.state==='uncertain').forEach(o=>checkOperation(o.payload.requestId,false));}catch(e){State.loading=false;if(!State.data){State.error=e.message;render();}else toast('โหลดข้อมูลล่าสุดไม่ได้: '+e.message,'error');}}
async function submitOperation(action,payload){if(!canWrite()){toast('บัญชีนี้มีสิทธิ์ดูข้อมูลเท่านั้น','error');return;}if(State.activeFailure!=null){State.failures.splice(State.activeFailure,1);State.activeFailure=null;}const op={action,payload,actorEmail:State.data.user.email,state:'sending',createdAt:new Date().toISOString(),error:''};State.pending.push(op);persistPending();closeDialog();render();await runOperation(op);}
async function runOperation(op){const actorEmail=op.actorEmail||State.data.user.email;op.actorEmail=actorEmail;op.state='sending';op.error='';persistPending();render();try{const res=await api(op.action,op.payload);if(State.data.user.email!==actorEmail){settleInactiveActor(op,'success');return;}const id=op.payload.requestId;State.pending=State.pending.filter(o=>o.payload.requestId!==id);applyBootstrap(res.bootstrap);persistPending();render();toast(op.action==='CREATE_PROJECT'?'เพิ่มโครงการสำเร็จ':'บันทึกรายการแล้ว · ยอดเงินอัปเดตเรียบร้อย');}catch(e){if(State.data.user.email!==actorEmail){settleInactiveActor(op,e.definite?'rejected':'uncertain');return;}const current=State.pending.find(o=>o.payload.requestId===op.payload.requestId);if(!current)return;if(e.definite){State.pending=State.pending.filter(o=>o.payload.requestId!==op.payload.requestId);State.failures.push({...op,error:e.message});toast('บันทึกไม่สำเร็จ เก็บฉบับร่างไว้แล้ว','error');}else{current.state='uncertain';current.error='ยังยืนยันผลไม่ได้';toast('รายการยังรอยืนยัน ตรวจสอบผลก่อนส่งรายการใหม่','warning');}persistPending();render();}}
async function checkOperation(id,announce=true){const op=State.pending.find(o=>o.payload.requestId===id);if(!op||State.busyChecks.has(id))return;const actorEmail=State.data.user.email;State.busyChecks.add(id);render();try{const res=await api('CHECK_OPERATION',{requestId:id});if(State.data.user.email!==actorEmail){if(res.found)settleInactiveActor({...op,actorEmail},'success');return;}if(res.found){State.pending=State.pending.filter(o=>o.payload.requestId!==id);if(res.bootstrap)applyBootstrap(res.bootstrap);else await refresh(false);persistPending();if(announce)toast('พบรายการที่บันทึกแล้ว อัปเดตยอดเรียบร้อย');}else if(announce)toast('ยังไม่พบรายการที่ยืนยัน อาจกำลังประมวลผลอยู่ ตรวจสอบอีกครั้งหรือส่งคำขอเดิมซ้ำ','warning');}catch(e){if(State.data.user.email!==actorEmail)return;if(announce)toast('ยังตรวจสอบผลไม่ได้: '+e.message,'warning');}finally{State.busyChecks.delete(id);render();}}
function settleInactiveActor(op,outcome){try{const key='sb-'+(IS_GAS?'live':'demo')+'-pending-v1:'+op.actorEmail;let ops=JSON.parse(sessionStorage.getItem(key)||'[]');ops=ops.filter(o=>o.payload.requestId!==op.payload.requestId);if(outcome==='uncertain')ops.push({...op,state:'uncertain',error:'ยังยืนยันผลไม่ได้'});sessionStorage.setItem(key,JSON.stringify(ops));}catch(e){}}
function closeDialog(){if($('#entry-dialog').open)$('#entry-dialog').close();State.dialog=null;}
function formValue(d,key,def=''){return esc(d[key]??def);}
function openProject(draft={}){if(!canWrite())return;State.dialog='project';State.activeFailure=null;State.formDraft=draft;$('#dialog-title').textContent='เพิ่มโครงการ';$('#dialog-subtitle').textContent='กำหนดวงเงินจัดสรรและเงินยกมาแยกกัน';$('#dialog-body').innerHTML=`<form id="project-form"><div id="form-error" class="form-error" role="alert" hidden></div><div class="form-grid"><div class="field"><label for="p-code">รหัสโครงการ *</label><input id="p-code" name="code" value="${formValue(draft,'code')}" maxlength="40" placeholder="เช่น AC-03" required></div><div class="field"><label for="p-year">ปีงบประมาณ *</label><input id="p-year" name="fiscalYear" type="number" min="2500" max="2800" value="${formValue(draft,'fiscalYear',State.year)}" required></div><div class="field full"><label for="p-name">ชื่อโครงการ *</label><input id="p-name" name="name" value="${formValue(draft,'name')}" maxlength="200" required></div><div class="field full"><label for="p-fund">กองเงิน *</label><select id="p-fund" name="fundId">${State.data.funds.map(f=>`<option value="${esc(f.id)}" ${(draft.fundId||State.fund)===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label for="p-category">กลุ่มงาน *</label><input id="p-category" name="category" value="${formValue(draft,'category')}" maxlength="100" placeholder="เช่น บริหารวิชาการ" required></div><div class="field"><label for="p-owner">ผู้รับผิดชอบ *</label><input id="p-owner" name="owner" value="${formValue(draft,'owner')}" maxlength="150" required></div><div class="field"><label for="p-allocated">งบจัดสรร (บาท) *</label><input id="p-allocated" name="allocated" inputmode="decimal" value="${draft.allocatedSatang!=null?esc((draft.allocatedSatang/100).toFixed(2)):''}" placeholder="0.00" required><small>วงเงินที่ได้รับอนุมัติให้ใช้จ่าย</small></div><div class="field"><label for="p-opening">เงินจริงยกมา (บาท) *</label><input id="p-opening" name="opening" inputmode="decimal" value="${draft.openingSatang!=null?esc((draft.openingSatang/100).toFixed(2)):'0.00'}" required><small>เงินจริงตั้งต้นก่อนรายการรับ / จ่าย</small></div></div><p class="form-help">การจัดสรรงบไม่เพิ่มยอดรับเงินจริง · เลือกกองเงินให้ตรงกับโครงการ</p><div class="form-footer"><button class="btn" type="button" data-action="close-dialog">ยกเลิก</button><button class="btn primary" type="submit">${icon('plus')}เพิ่มโครงการ</button></div></form>`;$('#entry-dialog').showModal();}
function openTransaction(projectId=null,draft={}){if(!canWrite())return;if(!State.data.projects.length){toast('เพิ่มโครงการก่อนบันทึกรายการเงินจริง','warning');openProject();return;}State.dialog='transaction';State.activeFailure=null;State.formDraft=draft;const options=State.data.projects.slice().sort((a,b)=>b.fiscalYear-a.fiscalYear||a.code.localeCompare(b.code));const id=draft.projectId||projectId||scopedProjects()[0]?.id||options[0].id;$('#dialog-title').textContent='บันทึกรายการเงินจริง';$('#dialog-subtitle').textContent='รับหรือจ่ายเงินจริงของโครงการที่เลือก';$('#dialog-body').innerHTML=`<form id="transaction-form"><div id="form-error" class="form-error" role="alert" hidden></div><div class="field" style="margin-bottom:15px"><label for="t-project">โครงการ *</label><select name="projectId" id="t-project">${options.map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(p.code+' · '+p.name+' ('+p.fiscalYear+')')}</option>`).join('')}</select></div><div id="tx-context"></div><div class="form-types"><label class="type-radio"><input type="radio" name="type" value="income" ${(draft.type||'expense')==='income'?'checked':''}>${icon('down')}รับเงินจริง</label><label class="type-radio"><input type="radio" name="type" value="expense" ${(draft.type||'expense')==='expense'?'checked':''}>${icon('up')}จ่ายเงินจริง</label></div><div class="form-grid"><div class="field"><label for="t-amount">จำนวนเงิน (บาท) *</label><input id="t-amount" name="amount" inputmode="decimal" value="${draft.amountSatang!=null?esc((draft.amountSatang/100).toFixed(2)):''}" placeholder="0.00" required></div><div class="field"><label for="t-date">วันที่ *</label><input id="t-date" name="date" type="date" value="${formValue(draft,'date',today())}" required></div><div class="field full"><label for="t-title">ชื่อรายการ *</label><input id="t-title" name="title" value="${formValue(draft,'title')}" maxlength="200" placeholder="เช่น จัดซื้อวัสดุกิจกรรม" required></div><div class="field full"><label for="t-document">เลขที่เอกสาร</label><input id="t-document" name="documentNo" value="${formValue(draft,'documentNo')}" maxlength="100" placeholder="เช่น ใบสำคัญจ่าย / เลขที่ใบเสร็จ"></div><div class="field full"><label for="t-note">หมายเหตุ</label><textarea id="t-note" name="note" maxlength="500" placeholder="รายละเอียดเพิ่มเติม">${formValue(draft,'note')}</textarea></div></div><p class="form-help">ยอดจริงอัปเดตเมื่อเซิร์ฟเวอร์ยืนยันแล้ว ระหว่างบันทึกจะแสดงผลคาดการณ์แยกไว้</p><div class="form-footer"><button class="btn" type="button" data-action="close-dialog">ยกเลิก</button><button class="btn primary" type="submit">${icon('check')}บันทึกรายการ</button></div></form>`;updateTxContext();$('#entry-dialog').showModal();}
function updateTxContext(){const p=State.data.projects.find(p=>p.id===$('#t-project')?.value);if(!p)return;const s=projectTotals(p);$('#tx-context').innerHTML=`<div class="form-context"><strong>${esc(fundName(p.fundId))}</strong>ปีงบประมาณ ${p.fiscalYear} · ${esc(p.owner)}</div><div class="mini-highlight"><span>งบเหลือ <strong class="num">${money(s.budgetRemaining)}</strong></span><span>เงินจริงเหลือ <strong class="num">${money(s.cashBalance)}</strong></span><span style="width:100%">จ่ายได้สูงสุดตอนนี้ <strong class="num">${money(Math.max(0,Math.min(s.budgetRemaining,s.cashBalance)))}</strong> บาท</span></div>`;}
function showFormError(message){$('#form-error').hidden=false;$('#form-error').textContent=message;$('#form-error').scrollIntoView({block:'nearest'});}
function formPayload(form){const f=Object.fromEntries(new FormData(form));if(form.id==='project-form'){const year=Number(f.fiscalYear);if(!Number.isInteger(year)||year<2500||year>2800)throw new Error('ตรวจสอบปีงบประมาณ พ.ศ.');for(const k of ['code','name','category','owner'])if(!String(f[k]).trim())throw new Error('กรอกข้อมูลที่มีเครื่องหมาย * ให้ครบ');return {requestId:uuid(),code:f.code.trim(),name:f.name.trim(),category:f.category.trim(),owner:f.owner.trim(),fiscalYear:year,fundId:f.fundId,allocatedSatang:moneyInput(f.allocated,true),openingSatang:moneyInput(f.opening,true)};}const a=String(f.date).split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)||d.getFullYear()!==a[0]||d.getMonth()!==a[1]-1||d.getDate()!==a[2])throw new Error('ตรวจสอบวันที่ของรายการ');if(!f.title.trim())throw new Error('กรอกชื่อรายการก่อนบันทึก');return {requestId:uuid(),projectId:f.projectId,date:f.date,type:f.type,amountSatang:moneyInput(f.amount),title:f.title.trim(),documentNo:f.documentNo.trim(),note:f.note.trim()};}
let searchTimer;
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-project]');if(!b)return;if(b.dataset.route){route(b.dataset.route);return;}if(b.dataset.project){route('detail',b.dataset.project);return;}if(b.dataset.addTo){openTransaction(b.dataset.addTo);return;}if(b.dataset.check){await checkOperation(b.dataset.check);return;}if(b.dataset.retry){const op=State.pending.find(o=>o.payload.requestId===b.dataset.retry);if(op&&op.state!=='sending')await runOperation(op);return;}if(b.dataset.draft!=null){const failure=State.failures[Number(b.dataset.draft)];if(failure){const p={...failure.payload};delete p.requestId;failure.action==='CREATE_PROJECT'?openProject(p):openTransaction(p.projectId,p);State.activeFailure=Number(b.dataset.draft);render();}return;}switch(b.dataset.action){case 'refresh':await refresh();break;case 'new-project':openProject();break;case 'new-transaction':openTransaction(State.view==='detail'?State.projectId:null);break;case 'close-dialog':closeDialog();break;case 'clear-dates':State.dateFrom='';State.dateTo='';render();break;case 'repair-schema':if(State.data.user.role!=='admin')return;b.disabled=true;b.innerHTML='<span class="spinner"></span>กำลังตรวจสอบ…';try{const res=await api('REPAIR_SCHEMA');toast(res?.message||'ตรวจและซ่อมโครงสร้างเรียบร้อย');await refresh(false);}catch(err){toast(err.message,'error');}finally{b.disabled=false;render();}break;case 'reset-demo':if(IS_GAS)return;if(State.pending.length){toast('ตรวจสอบรายการรอยืนยันให้ครบก่อนคืนข้อมูลตัวอย่าง','warning');return;}demoStore=initialDemo();persistDemo();State.failures=[];await refresh(false);toast('คืนข้อมูลตัวอย่าง 6 โครงการแล้ว');break;}});
document.addEventListener('keydown',e=>{const p=e.target.closest('[data-project]:not(button)');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();route('detail',p.dataset.project);}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){State.query=e.target.value;clearTimeout(searchTimer);const start=e.target.selectionStart;searchTimer=setTimeout(()=>{render();const el=$('#global-search');if(el){el.focus();el.setSelectionRange(start,start);}},180);}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='filter-year'){State.year=Number(el.value);persistFilters();render();}if(el.id==='filter-fund'){State.fund=el.value;persistFilters();render();}if(el.id==='tx-type'){State.txType=el.value;render();}if(el.id==='tx-from'){State.dateFrom=el.value;render();}if(el.id==='tx-to'){State.dateTo=el.value;render();}if(el.id==='t-project')updateTxContext();if(!IS_GAS&&el.id==='demo-role'){if(State.pending.length){el.value=demoConfig.role;toast('ตรวจสอบคำขอรอยืนยันให้ครบก่อนเปลี่ยนบทบาท','warning');return;}persistPending();demoConfig.role=el.value;saveDemoConfig();State.pending=[];State.failures=[];await refresh(false);}if(!IS_GAS&&el.id==='demo-delay'){demoConfig.delay=Number(el.value);saveDemoConfig();toast('ตั้งเวลาบันทึกตัวอย่างแล้ว');}if(!IS_GAS&&el.id==='demo-outcome'){demoConfig.next=el.value;saveDemoConfig();toast('ตั้งผลคำขอถัดไปแล้ว');}});
document.addEventListener('submit',async e=>{if(!['project-form','transaction-form'].includes(e.target.id))return;e.preventDefault();try{const action=e.target.id==='project-form'?'CREATE_PROJECT':'CREATE_TRANSACTION';const payload=formPayload(e.target);await submitOperation(action,payload);}catch(err){if($('#entry-dialog').open)showFormError(err.message);else toast(err.message,'error');}});
window.addEventListener('hashchange',()=>{const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('project/')){State.view='detail';State.projectId=hash.slice(8);}else if(NAV.some(n=>n[0]===hash)){State.view=hash;State.projectId=null;}render();});
const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('project/')){State.view='detail';State.projectId=hash.slice(8);}else if(NAV.some(n=>n[0]===hash))State.view=hash;
render();refresh(false);
</script>
